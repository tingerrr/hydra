engine: nixery

when:
  - event: [push, pull_request, manual]
    branch: [main]

dependencies:
  nixpkgs:
    - just
    - cargo-binstall

steps:
  - name: Install Typstyle
    command: "cargo-binstall typstyle@0.13.19"

  - name: Check formatting
    command: 'PATH="/tangled/home/.cargo/bin:${PATH}" just check-format'
